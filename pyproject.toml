[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "primordia-lab"
version = "0.1.0"
description = "An observable laboratory for artificial-life and emergent homeostasis experiments"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "PRIMORDIA contributors"}]
dependencies = ["numpy>=2.0,<3", "pygame-ce>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
primordia = "primordia.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
